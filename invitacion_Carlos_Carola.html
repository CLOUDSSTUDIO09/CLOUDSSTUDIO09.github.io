<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación de Boda - Carlos & Carola</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;

      /* FONDO ALEJADO (TEXTURA MÁS FINA) */
      background-color: #ececec;
      background-image: url("https://tu-nube.com/ruta/fondo.jpg");
      background-repeat: repeat;
      background-position: center;
      /* A mayor tamaño en píxeles, más "alejada" y fina se ve la textura del papel */
      background-size: 1800px auto; 
    }

    /* Contenedor maestro: mantiene la proporción exacta de la mesa de trabajo (720x1000) */
    .invitacion-canvas {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 720 / 1000;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    }

   /* Clase base para todos los objetos SVG posicionados */
    .svg-item {
      position: absolute;
      transform: translateX(-50%);
      opacity: 0;
      animation: flotarSuave 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-play-state: paused; /* <-- AGREGAR ESTA LÍNEA */
    }

    .svg-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 1. Título: "UNA CARTA DE AMOR DE:" */
    .titulo-svg {
      top: 6.4%;
      left: 50%;
      width: 34%;
      z-index: 2;
      animation-delay: 0.2s;
    }

    /* 2. Nombres: "Carlos & Carola" */
    .nombres-svg {
      top: 13.8%;
      left: 49.5%;
      width: 62%;
      z-index: 2;
      animation-delay: 0.5s;
    }

    /* 3. Sobre blanco con sombra (sin sello) */
    .sobre-svg {
      top: 41.2%;
      left: 50%;
      width: 73.5%;
      z-index: 2;
      animation-delay: 0.8s;
    }

    /* 4. Sello celeste perfectamente centrado y con enlace a la segunda página */
 .sello-link {
      position: absolute;
      top: 60.5%;
      left: 50%;
      width: 15.6%;
      z-index: 3;
      transform: translate(-50%, -50%);
      opacity: 0;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      animation: flotarSello 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 1.1s;
      animation-play-state: paused; /* <-- AGREGAR ESTA LÍNEA */
    }
.sello a {
      display: block;
      width: 100%;
      height: 100%;
    }
    .sello img {
      display: block;
      width: 100%;
      height: auto;
    }

/* <-- AGREGAR ESTA REGLA NUEVA --> */
    .invitacion-canvas.listo .svg-item,
    .invitacion-canvas.listo .sello-link {
      animation-play-state: running;
    }

    .sello-link img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .sello-link:hover img,
    .sello-link:active img {
      transform: scale(1.07);
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.18));
    }

    /* 5. Pie: "RESERVAMOS 1 CUPO PARA TI" */
    .cupo-svg {
      top: 91.5%;
      left: 52.2%;
      width: 39%;
      z-index: 2;
      animation-delay: 1.4s;
    }

    /* Animación flotante suave de arriba hacia abajo */
    @keyframes flotarSuave {
      0% {
        opacity: 0;
        transform: translate(-50%, -28px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes flotarSello {
      0% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 28px));
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>
 <main class="invitacion-canvas">
    
    <!-- FONDO -->
    <img src="https://filedn.com/lbCnADCejUvubTC5NNB6zzX/invitacion_tio_edy/pagina1/fondo.jpg">

    <!-- TÍTULO: "UNA CARTA DE AMOR DE:" -->
    <div class="svg-item titulo-svg">
      <img src="https://filedn.com/lbCnADCejUvubTC5NNB6zzX/invitacion_tio_edy/pagina1/titulo-03.svg">
    </div>

    <!-- NOMBRES: "Carlos & Carola" -->
    <div class="svg-item nombres-svg">
      <img src="https://filedn.com/lbCnADCejUvubTC5NNB6zzX/invitacion_tio_edy/pagina1/nombres-03.svg">
    </div>

    <!-- SOBRE BLANCO CON SOMBRA -->
    <div class="svg-item sobre-svg">
      <img src="https://filedn.com/lbCnADCejUvubTC5NNB6zzX/invitacion_tio_edy/pagina1/sobre-03.svg">
    </div>

    <!-- SELLO CELESTE CON ENLACE A LA SEGUNDA PÁGINA -->
  <div class="sello">
      <a href="invitacion_Carlos_Carola2.html">
        <img src="https://filedn.com/lbCnADCejUvubTC5NNB6zzX/invitacion_tio_edy/pagina1/sello-03.svg" alt="Abrir invitación">
      </a>
    </div>

    <!-- TEXTO INFERIOR: "RESERVAMOS 1 CUPO PARA TI" -->
    <div class="svg-item cupo-svg">
      <img src="https://filedn.com/lbCnADCejUvubTC5NNB6zzX/invitacion_tio_edy/pagina1/cupo-03.svg">
    </div>

  </main>

<script>
    window.addEventListener("load", () => {
      const lienzo = document.querySelector(".invitacion-canvas");
      const imagenes = Array.from(lienzo.querySelectorAll("img"));

      // Verifica que cada SVG haya terminado de decodificarse
      const promesas = imagenes.map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      });

      Promise.all(promesas).then(() => {
        // Pequeña pausa de 100ms para asegurar suavidad en el primer fotograma
        setTimeout(() => {
          lienzo.classList.add("listo");
        }, 100);
      });
    });
  </script>

</body>
</html>
